# The Python libraries of requirements.txt (but python-mpv, which comes
# with haltia-kit): aiohttp and PySocks from their source (aiohttp without
# its C parts), cryptography, cffi, orjson and zeroconf as x86_64 wheels
# for the runtime's Python, the rest as their py3-none-any wheels. Written
# by requirements.py; run it again when requirements.txt changes.
name: python3-requirements
buildsystem: simple
build-options:
  env:
    AIOHTTP_NO_EXTENSIONS: '1'
build-commands:
  - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
    --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps yandex-music ya-passport-auth qrcode aiohttp aiofiles yarl requests typing-extensions aiosendspin cpace noiseprotocol mashumaro cryptography orjson zeroconf aiohappyeyeballs aiosignal attrs frozenlist multidict propcache idna charset-normalizer urllib3 certifi PySocks cffi ifaddr
