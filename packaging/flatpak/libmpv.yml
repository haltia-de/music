# libmpv for sound only (haltia_kit.sound): no video outputs, no player
# program. Lua (LuaJIT) is in only for the options its scripts bring, which
# haltia_kit sets (ytdl=no): without them libmpv refuses to start. ffmpeg
# comes with the runtime (its AAC through the
# runtime's codecs-extra extension); mpv also needs libass and libplacebo,
# built here first. Flathub's shared-modules has no libmpv.
name: libmpv
buildsystem: meson
config-opts:
  - -Dlibmpv=true
  - -Dcplayer=false
  - -Dbuildtype=release
  - -Dauto_features=disabled
  - -Dpulse=enabled
  - -Dpipewire=enabled
  - -Dalsa=enabled
  - -Dlibavdevice=disabled
  - -Dgl=disabled
  - -Diconv=enabled
  - -Dzlib=enabled
  - -Dlua=luajit
  - -Dmanpage-build=disabled
  - -Dhtml-build=disabled
  - -Dpdf-build=disabled
cleanup:
  - /include
  - /lib/pkgconfig
  - /share
sources:
  - type: archive
    url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
    sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
modules:
  - name: luajit
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} PREFIX=/app
      - make install PREFIX=/app
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /lib/*.a
      - /share
    sources:
      - type: archive
        url: https://github.com/LuaJIT/LuaJIT/archive/dd3b24369ddfaa83c78cd6fdd91d157c8968ec8d.tar.gz
        sha256: a6ac8457c474c6fb71aaa7660dd5bf8f6e0506496fc74786b2dae18e26a768cc
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      - -Dvulkan=disabled
      - -Dopengl=disabled
      - -Dd3d11=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Dlcms=disabled
      - -Ddovi=disabled
      - -Dlibdovi=disabled
      - -Dxxhash=disabled
      - -Dunwind=disabled
      - -Ddemos=false
      - -Dtests=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
