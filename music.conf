# A music service in large type, playing in the background.
# Installed as /usr/local/share/b8k/apps.d/music.conf; b8k-apps adds it to
# the shell's programs (fields: see /usr/local/share/b8k/apps.conf).
[music]
label = Музыка
icon = /usr/local/share/b8k/music.svg
app_ids = b8k.Music b8k-music
exec = b8k-music
